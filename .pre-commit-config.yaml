# GoldenPath IDP - Hello App Pre-commit Configuration
# GOV-0013: DevSecOps Security Standards
# OB-0001: Developer Security Tooling Onboarding
#
# Installation:
#   pip install pre-commit
#   pre-commit install

repos:
  # MANDATORY: Secret Detection (Gitleaks)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        args: ["--redact"]

  # MANDATORY: Basic Security Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']

  # RECOMMENDED: YAML Linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: relaxed, rules: {line-length: {max: 120}}}']

  # RECOMMENDED: Dockerfile Linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: ['--ignore', 'DL3008', '--ignore', 'DL3013']

  # Python formatting (this is a Python app)
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

default_stages: [pre-commit]
fail_fast: false
