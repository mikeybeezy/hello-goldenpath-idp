apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base
  - namespace.yaml

images:
  - name: hello-goldenpath-idp
    newName: 593517239005.dkr.ecr.eu-west-2.amazonaws.com/hello-goldenpath-idp
    # Tag managed by Argo CD Image Updater (semver)
    # Manual sync required - see ADR-0172
    newTag: v1.0.0

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr-pull-secret
    target:
      kind: Deployment
      name: hello-goldenpath-idp
  # Prod: HA with 3 replicas
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: hello-goldenpath-idp
  # Prod: stricter resource limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    target:
      kind: Deployment
      name: hello-goldenpath-idp

configMapGenerator:
  - name: hello-goldenpath-idp-config
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=warn
