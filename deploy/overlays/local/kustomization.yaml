apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base
  - namespace.yaml

# Override image to use ECR
# For local Kind: either use ECR with pull secret or load image directly
images:
  - name: hello-goldenpath-idp
    newName: 593517239005.dkr.ecr.eu-west-2.amazonaws.com/hello-goldenpath-idp
    newTag: latest

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr-pull-secret
    target:
      kind: Deployment
      name: hello-goldenpath-idp

configMapGenerator:
  - name: hello-goldenpath-idp-config
    literals:
      - APP_ENV=local
      - LOG_LEVEL=debug
